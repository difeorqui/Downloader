# Calidad obligatoria (reglas globales §5). Nunca usar --no-verify ni desactivar hooks.
# Requiere el entorno activado (.venv\Scripts\activate o scripts/check.sh) y gitleaks en el PATH.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (formato)
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: gitleaks
        name: gitleaks (secretos)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: semgrep
        name: semgrep (OWASP)
        entry: semgrep --config p/python --config p/owasp-top-ten --error --quiet --metrics=off
        language: system
        types: [python]
      - id: pytest-rapido
        name: pytest rápido (fuera de producción)
        entry: python -m pytest -q -m "not perf and not fuzz"
        language: system
        pass_filenames: false
        types: [python]
